<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f6f52">
<title>Nout’ Kaz</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
 --bg:#f7f1e8;--card:#fffaf4;--green:#4f6f52;--green2:#6d8b68;--orange:#c76a2b;
 --cream:#f3dfc1;--text:#202a21;--muted:#77736c;--line:#e8ddcf;--danger:#9b3b31;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
#app{max-width:820px;margin:auto;min-height:100vh;padding-bottom:88px}
header{position:sticky;top:0;z-index:9;background:linear-gradient(var(--bg) 86%,rgba(247,241,232,0));padding:20px 17px 12px;display:flex;gap:12px;justify-content:space-between;align-items:center}
h1,h2,h3,p{margin-top:0}
h1{font-size:28px;margin-bottom:3px}
.subtitle{color:var(--muted);font-size:14px}
main{padding:5px 15px 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:15px;margin-bottom:13px;box-shadow:0 8px 24px rgba(73,52,31,.06)}
.primary,.soft,.outline,.danger,.circle{border:0;border-radius:14px;padding:12px 15px}
.primary{background:var(--green);color:#fff}
.soft{background:var(--cream);color:var(--text)}
.outline{background:transparent;border:1px solid var(--green);color:var(--green)}
.danger{background:#f6e4e0;color:var(--danger)}
.circle{width:45px;height:45px;padding:0;border-radius:50%;background:var(--green);color:#fff;font-size:24px}
.iconbtn{border:0;background:none;font-size:20px;padding:6px}
nav{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:0;width:min(820px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fffaf5;border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;color:#6f6b65;padding:5px 2px;font-size:12px}
nav .ico{display:block;font-size:21px;margin-bottom:2px}
nav button.active{color:var(--green);font-weight:800}
.searchbar{display:flex;gap:9px;margin-bottom:12px}
input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:11px 12px;color:var(--text)}
textarea{resize:vertical}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:8px}
.chipfilter{white-space:nowrap;border:1px solid var(--line);background:#fff8f0;border-radius:99px;padding:8px 13px}
.chipfilter.active{background:var(--green);color:white;border-color:var(--green)}
.recipe{display:grid;grid-template-columns:74px 1fr auto;gap:12px;align-items:center}
.thumb{width:74px;height:74px;border-radius:17px;overflow:hidden;background:#ead7bb;display:grid;place-items:center;font-size:31px}
.thumb img{width:100%;height:100%;object-fit:cover}
.recipe h3{font-size:16px;margin:0 0 5px}
.muted{color:var(--muted);font-size:13px}
.fav{font-size:22px;color:var(--orange)}
.hero{height:220px;border-radius:19px;overflow:hidden;background:#ead7bb;display:grid;place-items:center;font-size:60px;margin-bottom:14px}
.hero img{width:100%;height:100%;object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:#f5ecdf;border-radius:14px;padding:10px 7px;text-align:center;font-size:12px}
.stat b{display:block;font-size:14px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
.ingredient,.step,.shoprow,.pantryrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eee4d8}
.stepnum{flex:0 0 25px;height:25px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:12px}
.actions2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick{min-height:110px;text-align:left;border:0;border-radius:18px;padding:17px;background:var(--cream)}
.quick.green{background:var(--green);color:#fff}
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.weekbar button{border:0;background:none;font-size:23px}
.week{display:grid;grid-template-columns:68px 1fr 1fr;background:white;border:1px solid var(--line);border-radius:17px;overflow:hidden}
.week>div{padding:9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:57px}
.week>div:nth-child(3n){border-right:0}
.week .head{min-height:auto;background:#f3eee8;text-align:center;font-weight:800}
.day{text-align:center;font-size:12px}
.meal{font-size:12px;cursor:pointer}
.mealchip{background:#e9f1e6;border-radius:10px;padding:7px;line-height:1.2}
.group h3{display:flex;justify-content:space-between;align-items:center}
.shoprow input[type=checkbox],.pantryrow input[type=checkbox]{width:20px;height:20px;margin-top:1px}
.shoprow.done span{text-decoration:line-through;color:#999}
.badge{background:#f1e3d0;border-radius:99px;padding:4px 8px;font-size:11px}
.small{font-size:12px}
.empty{text-align:center;color:var(--muted);padding:26px}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700}
dialog{border:0;border-radius:22px;background:var(--card);width:min(590px,94vw);max-height:92vh;padding:0;box-shadow:0 30px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dialogbody{padding:19px;overflow:auto;max-height:92vh}
.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:10px}
label{display:block;font-weight:700;margin:12px 0}
label input,label textarea,label select{margin-top:6px;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dialogactions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
.photoPreview{height:150px;border:1px dashed var(--line);border-radius:15px;display:grid;place-items:center;overflow:hidden;background:#f7efe3;margin-top:8px}
.photoPreview img{width:100%;height:100%;object-fit:cover}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#eee7df;border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{border:0;background:none;padding:9px;border-radius:11px}
.tabs button.active{background:#fff;color:var(--green);font-weight:800}
.notice{background:#eef4eb;border-left:4px solid var(--green);padding:11px 12px;border-radius:10px;font-size:13px}

.mealchoices{display:grid;gap:8px;margin-top:8px}
.mealchoice{display:grid;grid-template-columns:24px 52px 1fr;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px;cursor:pointer}
.mealchoice input{width:20px;height:20px;margin:0}
.mealchoice .mini{width:52px;height:52px;border-radius:12px;overflow:hidden;background:#ead7bb;display:grid;place-items:center}
.mealchoice .mini img{width:100%;height:100%;object-fit:cover}
.mealstack{display:grid;gap:5px}
.mealstack .mealchip{padding:6px}

.syncpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 9px;border-radius:99px;background:#eef4eb;color:var(--green);margin-top:5px}
.syncpill.offline{background:#f5e8df;color:#9a572d}
.authscreen{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.authbox{width:min(430px,100%);background:var(--card);border:1px solid var(--line);border-radius:25px;padding:24px;box-shadow:0 20px 60px rgba(60,45,30,.12)}
.authlogo{width:110px;height:110px;border-radius:26px;overflow:hidden;margin:0 auto 18px}
.authlogo img{width:100%;height:100%;object-fit:cover}
.authbox h1{text-align:center}.authbox .subtitle{text-align:center;margin-bottom:18px}
.autherror{color:#9b3b31;font-size:13px;margin-top:10px;min-height:18px}
.userbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.recipe{grid-template-columns:63px 1fr auto}.thumb{width:63px;height:63px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="authScreen" class="authscreen" style="display:none">
  <div class="authbox">
    <div class="authlogo"><img src="nout-kaz-icon.png" alt="Nout’ Kaz"></div>
    <h1>Nout’ Kaz</h1>
    <div class="subtitle">Votre espace partagé pour les recettes, repas et courses.</div>
    <form id="loginForm">
      <label>Adresse e-mail<input id="loginEmail" type="email" autocomplete="email" required></label>
      <label>Mot de passe<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <button class="primary" style="width:100%;margin-top:8px">Se connecter</button>
      <div id="authError" class="autherror"></div>
    </form>
  </div>
</div>

<div id="app">
<header>
 <div><h1 id="title">Accueil</h1><div class="subtitle" id="subtitle"></div></div>
 <div class="userbar"><span id="syncStatus" class="syncpill">☁ Synchronisation</span><button class="iconbtn" id="logoutBtn" title="Se déconnecter">⇥</button><button class="circle" id="headerAdd">＋</button></div>
</header>
<main id="view"></main>
<nav>
 <button data-v="home" class="active"><span class="ico">⌂</span>Accueil</button>
 <button data-v="recipes"><span class="ico">▤</span>Recettes</button>
 <button data-v="planning"><span class="ico">▦</span>Planning</button>
 <button data-v="shopping"><span class="ico">🛒</span>Courses</button>
</nav>
</div>

<dialog id="recipeDialog"><div class="dialogbody">
 <div class="dialoghead"><h2 id="recipeFormTitle">Ajouter une recette</h2><button class="soft" onclick="recipeDialog.close()">✕</button></div>
 <form id="recipeForm">
  <input id="rid" type="hidden">
  <label>Photo de la recette<input id="rphoto" type="file" accept="image/*"></label>
  <div id="photoPreview" class="photoPreview">📷 Photo facultative</div>
  <label>Nom<input id="rname" required></label>
  <div class="grid2">
   <label>Nombre de personnes<input id="rserv" type="number" min="1" value="2" required></label>
   <label>Préparation (min)<input id="rprep" type="number" min="0" value="20"></label>
   <label>Cuisson (min)<input id="rcook" type="number" min="0" value="20"></label>
   <label>Difficulté<select id="rdiff"><option>Facile</option><option>Moyenne</option><option>Difficile</option></select></label>
  </div>
  <label>Catégorie<select id="rcat"><option>Plat</option><option>Protéines</option><option>Légumes</option><option>Féculents</option><option>Entrée</option><option>Dessert</option><option>Petit-déjeuner</option><option>Goûter</option><option>Boisson</option><option>Autre</option></select></label>
  <label>Ingrédients<textarea id="ring" rows="7" required placeholder="2 | pièce | oignon | Fruits & légumes&#10;200 | g | champignons | Fruits & légumes"></textarea></label>
  <div class="muted">Une ligne : quantité | unité | ingrédient | rayon</div>

  <div class="dialogactions"><button type="button" class="soft" onclick="recipeDialog.close()">Annuler</button><button class="primary">Enregistrer</button></div>
 </form>
</div></dialog>

<dialog id="detailDialog"><div class="dialogbody" id="detailBody"></div></dialog>

<dialog id="mealDialog"><div class="dialogbody">
 <div class="dialoghead"><h2>Composer le repas</h2><button class="soft" onclick="mealDialog.close()">✕</button></div>
 <form id="mealForm">
  <input id="mdate" type="hidden">
  <label>Moment<select id="mslot"><option value="midi">Midi</option><option value="soir">Soir</option></select></label>
  <label>Nombre de personnes<input id="mserv" type="number" min="1" value="2"></label>
  <label>Recettes</label>
  <div class="muted" style="margin-bottom:8px">Sélectionne une ou plusieurs recettes pour composer le même repas.</div>
  <div id="mealCategoryFilters" class="chips" style="margin-bottom:10px"></div>
  <div id="mealRecipeChoices"></div>
  <div class="dialogactions"><button type="button" class="soft" id="removeMeal">Retirer le repas</button><button class="primary">Enregistrer</button></div>
 </form>
</div></dialog>

<dialog id="manualDialog"><div class="dialogbody">
 <div class="dialoghead"><h2>Ajouter un article</h2><button class="soft" onclick="manualDialog.close()">✕</button></div>
 <form id="manualForm">
  <label>Article<input id="manualName" required placeholder="Papier toilette"></label>
  <div class="grid2"><label>Quantité<input id="manualQty" type="number" step="0.01" value="1"></label><label>Unité<input id="manualUnit" placeholder="paquet"></label></div>
  <label>Rayon
    <input id="manualSection" list="shoppingSections" value="Autre">
    <datalist id="shoppingSections">
      <option value="Fruits & légumes">
      <option value="Boucherie / Poissonnerie">
      <option value="Produits frais">
      <option value="Épicerie">
      <option value="Surgelés">
      <option value="Boulangerie">
      <option value="Boissons">
      <option value="Hygiène">
      <option value="Entretien">
      <option value="Maison">
      <option value="Animaux">
      <option value="Parapharmacie">
      <option value="Autre">
    </datalist></label>
  <div class="dialogactions"><button class="primary">Ajouter</button></div>
 </form>
</div></dialog>

<script>
const KEY="noutKazLocalV4";
const SUPABASE_URL="https://fnmeafiolmisbnvgtvhj.supabase.co";
const SUPABASE_KEY="sb_publishable_MFJ9AbJQKzbGiuKcfQPoCg__8b_yaL3";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});
const DAYS=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const seed={recipes:[
{id:"r1",name:"Pâtes à la tomate et basilic",photo:"",servings:2,prep:20,cook:25,difficulty:"Facile",category:"Plat",favorite:true,ingredients:[
{qty:200,unit:"g",name:"pâtes",section:"Épicerie"},{qty:400,unit:"g",name:"tomates concassées",section:"Épicerie"},{qty:1,unit:"pièce",name:"oignon",section:"Fruits & légumes"},{qty:2,unit:"gousse",name:"ail",section:"Fruits & légumes"},{qty:2,unit:"c. à soupe",name:"huile d'olive",section:"Épicerie"},{qty:1,unit:"bouquet",name:"basilic frais",section:"Fruits & légumes"}],
steps:["Émincer l'oignon et l'ail.","Faire revenir dans l'huile d'olive.","Ajouter les tomates et laisser mijoter.","Cuire les pâtes puis mélanger.","Ajouter le basilic frais."]},
{id:"r2",name:"Curry de légumes",photo:"",servings:2,prep:15,cook:25,difficulty:"Facile",category:"Plat",favorite:false,ingredients:[
{qty:1,unit:"pièce",name:"courgette",section:"Fruits & légumes"},{qty:2,unit:"pièce",name:"carotte",section:"Fruits & légumes"},{qty:1,unit:"pièce",name:"oignon",section:"Fruits & légumes"},{qty:1,unit:"boîte",name:"lait de coco",section:"Épicerie"}],steps:["Couper les légumes.","Faire revenir l'oignon.","Ajouter les légumes.","Verser le lait de coco et laisser mijoter."]}
],planning:{},checked:{},manual:[],pantry:[],history:[],shoppingWeeks:1,shoppingGeneratedAt:null};

let data=JSON.parse(localStorage.getItem(KEY)||JSON.stringify(seed));
if(!data.pantry)data.pantry=[]; if(!data.history)data.history=[]; if(!data.manual)data.manual=[];
let current="home", weekOffset=0, recipePhoto="", recipeFilter="Toutes", shoppingTab="liste";
let currentUser=null, householdUuid=null, remoteRowId=null, syncTimer=null, isApplyingRemote=false;
const $=s=>document.querySelector(s), view=$("#view"), title=$("#title"), subtitle=$("#subtitle");

function setSyncStatus(text,offline=false){
 const el=$("#syncStatus"); if(!el)return;
 el.textContent=text; el.classList.toggle("offline",offline);
}
async function save(norender=false){
 localStorage.setItem(KEY,JSON.stringify(data));
 if(!norender)render();
 if(currentUser && householdUuid && !isApplyingRemote){
   clearTimeout(syncTimer);
   syncTimer=setTimeout(pushRemote,350);
 }
}
async function pushRemote(){
 if(!currentUser||!householdUuid)return;
 try{
   setSyncStatus("☁ Synchronisation…");
   const payload={...data,_sync_updated_at:new Date().toISOString()};
   const {error}=await sb.from("nout_kaz_data")
     .update({data:payload,updated_at:new Date().toISOString()})
     .eq("household_uuid",householdUuid);
   if(error)throw error;
   setSyncStatus("✓ Synchronisé");
 }catch(err){
   console.error(err); setSyncStatus("⚠ Hors ligne",true);
 }
}
async function loadRemote(){
 const {data:membership,error:me}=await sb.from("household_members")
   .select("household_id").eq("user_id",currentUser.id).maybeSingle();
 if(me)throw me;
 if(!membership)throw new Error("Ce compte n’est rattaché à aucun Nout’ Kaz.");
 householdUuid=membership.household_id;
 const {data:row,error}=await sb.from("nout_kaz_data")
   .select("id,data,updated_at").eq("household_uuid",householdUuid).maybeSingle();
 if(error)throw error;
 if(!row)throw new Error("Les données partagées Nout’ Kaz sont introuvables.");
 remoteRowId=row.id;
 const remote=row.data||{};
 const remoteHasContent=remote.recipes||remote.planning||remote.manual||remote.pantry;
 if(remoteHasContent && Object.keys(remote).length>1){
   isApplyingRemote=true;
   data={...seed,...remote};
   if(!data.pantry)data.pantry=[];if(!data.history)data.history=[];if(!data.manual)data.manual=[];
   localStorage.setItem(KEY,JSON.stringify(data));
   isApplyingRemote=false;
 }else{
   // First connection: migrate this device's existing Nout' Kaz to the shared cloud row.
   await pushRemote();
 }
 setSyncStatus("✓ Synchronisé");
 render();
}
async function bootAuth(){
 const {data:{session}}=await sb.auth.getSession();
 if(session){
   currentUser=session.user; $("#authScreen").style.display="none"; $("#app").style.display="";
   try{await loadRemote()}catch(err){console.error(err);setSyncStatus("⚠ Sync",true);alert(err.message)}
 }else{
   currentUser=null; $("#app").style.display="none"; $("#authScreen").style.display="grid";
 }
}

function uid(p="x"){return p+Math.random().toString(36).slice(2,9)}
function dateKey(d){let x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)}
function monday(offset=0){let d=new Date(),n=(d.getDay()+6)%7;d.setDate(d.getDate()-n+offset*7);d.setHours(12,0,0,0);return d}
function weekDates(offset=0){let m=monday(offset);return Array.from({length:7},(_,i)=>{let d=new Date(m);d.setDate(m.getDate()+i);return d})}
function weekLabel(offset=0){let ds=weekDates(offset);return `${ds[0].toLocaleDateString("fr-FR",{day:"numeric",month:"short"})} – ${ds[6].toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}`}
function getRecipe(id){return data.recipes.find(r=>r.id===id)}
function mealItems(m){
 if(!m)return [];
 if(Array.isArray(m))return m.map(x=>typeof x==="string"?{recipeId:x}:x);
 if(Array.isArray(m.recipes))return m.recipes.map(x=>typeof x==="string"?{recipeId:x}:x);
 return [{recipeId:m.recipeId||m,servings:m.servings}];
}
function mealRecipes(m){return mealItems(m).map(x=>({item:x,r:getRecipe(x.recipeId)})).filter(x=>x.r)}
function fmtNum(n){return Number.isInteger(+n)?String(+n):(+n).toFixed(2).replace(".",",")}
function normalize(s){return (s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function head(a,b){title.textContent=a;subtitle.textContent=b||""}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function imgHTML(r,cls=""){return r.photo?`<img src="${r.photo}" alt="">`:"🍲"}
function go(v){current=v;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.v===v));render()}
window.go=go;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.v));
$("#headerAdd").onclick=()=>openRecipe();

function render(){({home,recipes,planning,shopping}[current]||home)()}
function home(){
 head("Nout’ Kaz 🏡","Recettes, repas et courses de la maison");
 let today=dateKey(new Date()), p=data.planning[today]||{}, upcoming=[];
 weekDates(0).forEach(d=>{let q=data.planning[dateKey(d)]||{};["midi","soir"].forEach(slot=>{if(q[slot]){let rs=mealRecipes(q[slot]);if(rs.length)upcoming.push({d,slot,rs,serv:q[slot].servings||rs[0].r.servings})}})});
 let tod=[["midi",p.midi],["soir",p.soir]].filter(x=>x[1]).map(([slot,m])=>{let rs=mealRecipes(m);return rs.length?`<div class="ingredient"><b>${slot==="midi"?"Midi":"Soir"}</b><span>${rs.map(x=>escapeHtml(x.r.name)).join(" + ")}</span></div>`:""}).join("");
 view.innerHTML=`
 <div class="card">
   <h2>Aujourd'hui</h2>${tod||'<div class="empty">Aucun repas prévu aujourd’hui.</div>'}
 </div>
 <div class="quickgrid">
  <button class="quick green" onclick="go('shopping')">🛒<br><br><b>Voir la liste<br>de courses</b></button>
  <button class="quick" onclick="openRecipe()">＋<br><br><b>Ajouter une<br>recette</b></button>
 </div>
 <div class="card" style="margin-top:13px"><h3>À venir cette semaine</h3>
 ${upcoming.length?upcoming.slice(0,7).map(x=>`<div class="ingredient upcoming-meal" role="button" tabindex="0" data-recipe-id="${x.rs[0].r.id}" style="cursor:pointer"><span class="badge">${x.d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric"})}</span><div style="flex:1"><div style="font-weight:700">${x.rs.map(y=>escapeHtml(y.r.name)).join(" + ")} <span aria-hidden="true">›</span></div><div class="muted">${x.slot} · ${x.serv} pers.</div></div></div>`).join(""):'<div class="empty">Ajoute tes repas dans le planning.</div>'}
 </div>
 </div>
 <div class="card"><h3>Suggestions avec ce que tu as</h3>${suggestionsHTML()}</div>`;
 document.querySelectorAll(".upcoming-meal").forEach(el=>{
   const open=()=>showDetail(el.dataset.recipeId);
   el.addEventListener("click",open);
   el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});
 });
}
function suggestionsHTML(){
 if(!data.pantry.length)return `<div class="muted">Ajoute des ingrédients dans « Courses → Stock maison » pour obtenir des suggestions.</div>`;
 let have=new Set(data.pantry.map(x=>normalize(x.name)));
 let scored=data.recipes.map(r=>{let hits=r.ingredients.filter(i=>have.has(normalize(i.name))).length;return{r,hits,total:r.ingredients.length}}).filter(x=>x.hits>0).sort((a,b)=>b.hits-a.hits);
 return scored.slice(0,4).map(x=>`<div class="ingredient" onclick="showDetail('${x.r.id}')" style="cursor:pointer"><b>${escapeHtml(x.r.name)}</b><span class="muted">${x.hits}/${x.total} ingrédients disponibles</span></div>`).join("")||`<div class="muted">Aucune suggestion pour le moment.</div>`;
}

function recipes(){
 head("Recettes","Plats, protéines, légumes, féculents et plus");
 let cats=["Toutes","❤️ Favoris",...new Set(data.recipes.map(r=>r.category))];
 view.innerHTML=`<div class="searchbar"><input id="rsearch" placeholder="🔎 Rechercher une recette ou un ingrédient…"></div>
 <div class="chips">${cats.map(c=>`<button class="chipfilter ${recipeFilter===c?"active":""}" onclick="setFilter('${escapeHtml(c)}')">${escapeHtml(c)}</button>`).join("")}</div>
 <div id="recipeList"></div>`;
 $("#rsearch").oninput=e=>drawRecipes(e.target.value);drawRecipes("");
}
window.setFilter=c=>{recipeFilter=c;recipes()};
function drawRecipes(q){
 let nq=normalize(q);
 let arr=data.recipes.filter(r=>{
  let ok=recipeFilter==="Toutes"||recipeFilter==="❤️ Favoris"&&r.favorite||r.category===recipeFilter;
  let text=normalize(r.name+" "+r.category+" "+r.ingredients.map(i=>i.name).join(" "));
  return ok&&(!nq||text.includes(nq));
 });
 $("#recipeList").innerHTML=arr.length?arr.map(r=>`<div class="card recipe" onclick="showDetail('${r.id}')" style="cursor:pointer">
  <div class="thumb">${imgHTML(r)}</div>
  <div><h3>${escapeHtml(r.name)}</h3><div class="muted">${r.prep+r.cook} min · ${r.servings} pers. · ${escapeHtml(r.category)}</div></div>
  <button class="iconbtn fav" onclick="event.stopPropagation();toggleFav('${r.id}')">${r.favorite?"♥":"♡"}</button></div>`).join(""):`<div class="empty">Aucune recette trouvée.</div>`;
}
window.toggleFav=id=>{let r=getRecipe(id);r.favorite=!r.favorite;save()};
window.showDetail=function(id,mult=1){
 let r=getRecipe(id);if(!r)return;
 let servings=Math.max(1,Math.round(r.servings*mult));
 $("#detailBody").innerHTML=`
 <div class="dialoghead"><button class="soft" onclick="detailDialog.close()">←</button><div><button class="iconbtn" onclick="editRecipe('${r.id}')">✎</button><button class="iconbtn fav" onclick="toggleFavDetail('${r.id}')">${r.favorite?"♥":"♡"}</button></div></div>
 <div class="hero">${imgHTML(r)}</div>
 <h2>${escapeHtml(r.name)}</h2>
 <div class="stats"><div class="stat"><b>${r.prep} min</b>Préparation</div><div class="stat"><b>${r.cook} min</b>Cuisson</div><div class="stat"><b>${escapeHtml(r.difficulty)}</b>Difficulté</div><div class="stat"><b>${servings}</b>Personnes</div></div>
 <div class="section-title"><h3>Ingrédients</h3><div><button class="soft small" onclick="changeDetailServ('${r.id}',${servings-1})">−</button> <span class="badge">${servings} pers.</span> <button class="soft small" onclick="changeDetailServ('${r.id}',${servings+1})">＋</button></div></div>
 ${r.ingredients.map(i=>`<div class="ingredient"><span>•</span><span>${fmtNum(i.qty*servings/r.servings)} ${escapeHtml(i.unit)} ${escapeHtml(i.name)}</span></div>`).join("")}
 <div class="section-title"><h3>Étapes</h3></div>
 ${r.steps.map((s,i)=>`<div class="step"><span class="stepnum">${i+1}</span><span>${escapeHtml(s)}</span></div>`).join("")}
 <div class="actions2" style="margin-top:16px"><button class="outline" onclick="editRecipe('${r.id}')">Modifier</button><button class="danger" onclick="deleteRecipe('${r.id}')">Supprimer</button></div>`;
 detailDialog.showModal();
}
window.changeDetailServ=(id,s)=>{let r=getRecipe(id);showDetail(id,s/r.servings)};
window.toggleFavDetail=id=>{let r=getRecipe(id);r.favorite=!r.favorite;save(true);showDetail(id)};
window.deleteRecipe=id=>{if(confirm("Supprimer cette recette ?")){data.recipes=data.recipes.filter(r=>r.id!==id);detailDialog.close();save()}};
window.editRecipe=id=>{detailDialog.close();openRecipe(getRecipe(id))};

window.openRecipe=function(r=null){
 recipePhoto=r?.photo||""; $("#recipeFormTitle").textContent=r?"Modifier la recette":"Ajouter une recette";
 $("#rid").value=r?.id||"";$("#rname").value=r?.name||"";$("#rserv").value=r?.servings||2;$("#rprep").value=r?.prep??20;$("#rcook").value=r?.cook??20;$("#rdiff").value=r?.difficulty||"Facile";$("#rcat").value=r?.category||"Plat";
 $("#ring").value=r?r.ingredients.map(i=>`${i.qty} | ${i.unit} | ${i.name} | ${i.section}`).join("\n"):"";
 $("#rsteps").value=r?r.steps.join("\n"):"";renderPhotoPreview();recipeDialog.showModal();
}
function renderPhotoPreview(){photoPreview.innerHTML=recipePhoto?`<img src="${recipePhoto}" alt="">`:"📷 Photo facultative"}
$("#rphoto").onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{recipePhoto=rd.result;renderPhotoPreview()};rd.readAsDataURL(f)};
$("#recipeForm").onsubmit=e=>{
 e.preventDefault();let id=$("#rid").value||uid("r");
 let ingredients=$("#ring").value.split("\n").map(x=>x.trim()).filter(Boolean).map(l=>{let [qty,unit,name,section]=l.split("|").map(x=>x.trim());return{qty:parseFloat((qty||"0").replace(",","."))||0,unit:unit||"",name:name||"",section:section||"Autre"}});
 let existing=getRecipe(id);let r={id,name:$("#rname").value.trim(),photo:recipePhoto,servings:+$("#rserv").value,prep:+$("#rprep").value||0,cook:+$("#rcook").value||0,difficulty:$("#rdiff").value,category:$("#rcat").value,favorite:existing?.favorite||false,ingredients,steps:$("#rsteps").value.split("\n").map(x=>x.trim()).filter(Boolean)};
 let ix=data.recipes.findIndex(x=>x.id===id);ix>=0?data.recipes[ix]=r:data.recipes.push(r);recipeDialog.close();save();
};

function planning(){
 head("Planning","Organise plusieurs semaines à l'avance");
 let cells=`<div class="head"></div><div class="head">Midi</div><div class="head">Soir</div>`;
 weekDates(weekOffset).forEach((d,i)=>{let k=dateKey(d),p=data.planning[k]||{};
   cells+=`<div class="day"><b>${DAYS[i]}</b><br>${d.getDate()}</div>${["midi","soir"].map(slot=>{
    let m=p[slot],rs=mealRecipes(m);return `<div class="meal" onclick="openMeal('${k}','${slot}')">${rs.length?`<div class="mealstack">${rs.map(x=>`<div class="mealchip">${escapeHtml(x.r.name)}</div>`).join("")}<div class="muted">${m.servings||rs[0].r.servings} pers.</div></div>`:"＋ Ajouter"}</div>`}).join("")}`;
 });
 view.innerHTML=`<div class="weekbar"><button onclick="changeWeek(-1)">‹</button><b>${weekLabel(weekOffset)}</b><button onclick="changeWeek(1)">›</button></div>
 <div class="card"><div class="week">${cells}</div></div>
 <div class="actions2"><button class="soft" onclick="weekOffset=0;planning()">Cette semaine</button><button class="outline" onclick="copyWeek()">Dupliquer la semaine</button></div>
 <div class="card" style="margin-top:13px"><h3>Historique récent</h3>${historyHTML()}</div>`;
}
window.changeWeek=n=>{weekOffset+=n;planning()};
window.openMeal=(k,slot)=>{
 $("#mdate").value=k;$("#mslot").value=slot;
 let existing=data.planning[k]?.[slot],selected=new Set(mealItems(existing).map(x=>x.recipeId));
 let first=mealRecipes(existing)[0]?.r;
 $("#mserv").value=existing?.servings||first?.servings||2;
 const mealCategories=["Toutes",...new Set(data.recipes.map(r=>r.category||"Autre"))];
 let activeMealCategory="Toutes";
 const drawMealRecipes=()=>{
   const recipes=activeMealCategory==="Toutes"?data.recipes:data.recipes.filter(r=>(r.category||"Autre")===activeMealCategory);
   $("#mealRecipeChoices").innerHTML=`<div class="mealchoices">${recipes.map(r=>`<label class="mealchoice">
     <input type="checkbox" value="${r.id}" ${selected.has(r.id)?"checked":""}>
     <span class="mini">${imgHTML(r)}</span>
     <span><b>${escapeHtml(r.name)}</b><br><span class="muted">${escapeHtml(r.category)} · ${r.servings} pers.</span></span>
   </label>`).join("")}</div>`;
 };
 $("#mealCategoryFilters").innerHTML=mealCategories.map(c=>`<button type="button" class="chipfilter ${c==="Toutes"?"active":""}" data-meal-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("");
 $("#mealCategoryFilters").querySelectorAll("[data-meal-cat]").forEach(btn=>btn.onclick=()=>{
   document.querySelectorAll("#mealRecipeChoices input:checked").forEach(cb=>selected.add(cb.value));
   activeMealCategory=btn.dataset.mealCat;
   $("#mealCategoryFilters").querySelectorAll("[data-meal-cat]").forEach(b=>b.classList.toggle("active",b===btn));
   drawMealRecipes();
 });
 drawMealRecipes();
 $("#removeMeal").style.visibility=existing?"visible":"hidden";mealDialog.showModal();
};
$("#mealForm").onsubmit=e=>{
 e.preventDefault();let k=$("#mdate").value,slot=$("#mslot").value;
 document.querySelectorAll("#mealRecipeChoices input:checked").forEach(cb=>selected.add(cb.value));
 let ids=[...selected];
 if(!ids.length){alert("Sélectionne au moins une recette.");return}
 data.planning[k]??={};
 data.planning[k][slot]={recipes:ids.map(recipeId=>({recipeId})),servings:+$("#mserv").value};
 ids.forEach(rid=>data.history.unshift({date:k,slot,recipeId:rid}));
 data.history=data.history.slice(0,100);mealDialog.close();save()
};
$("#removeMeal").onclick=()=>{let k=$("#mdate").value,slot=$("#mslot").value;if(data.planning[k])delete data.planning[k][slot];mealDialog.close();save()};
window.copyWeek=()=>{
 let src=weekDates(weekOffset),dst=weekDates(weekOffset+1);
 src.forEach((d,i)=>{let p=data.planning[dateKey(d)];if(p)data.planning[dateKey(dst[i])]=JSON.parse(JSON.stringify(p))});
 alert("La semaine a été copiée sur la suivante.");save();
};
function historyHTML(){
 let arr=data.history.slice(0,8).map(h=>{let r=getRecipe(h.recipeId);return r?`<div class="ingredient"><span class="badge">${new Date(h.date+"T12:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</span><span>${escapeHtml(r.name)} · ${h.slot}</span></div>`:""}).join("");
 return arr||`<div class="muted">L’historique se remplira lorsque tu planifieras des repas.</div>`;
}

function shopping(){
 head("Courses","Ta liste calculée automatiquement");
 view.innerHTML=`<div class="tabs"><button class="${shoppingTab==="liste"?"active":""}" onclick="setShopTab('liste')">Liste</button><button class="${shoppingTab==="stock"?"active":""}" onclick="setShopTab('stock')">Stock maison</button><button class="${shoppingTab==="partage"?"active":""}" onclick="setShopTab('partage')">Partage</button></div><div id="shopContent"></div>`;
 drawShop();
}
window.setShopTab=t=>{shoppingTab=t;drawShop()};
function plannedIngredients(weeks){
 let out={};
 for(let w=0;w<weeks;w++)weekDates(w).forEach(d=>{let p=data.planning[dateKey(d)]||{};["midi","soir"].forEach(slot=>{let m=p[slot];if(!m)return;mealRecipes(m).forEach(({r})=>{let serv=m.servings||r.servings,fac=serv/r.servings;r.ingredients.forEach(i=>{let k=normalize(i.name)+"|"+normalize(i.unit)+"|"+normalize(i.section);if(!out[k])out[k]={...i,qty:0,key:k};out[k].qty+=i.qty*fac})})})});
 return out;
}
function pantryHas(i){return data.pantry.some(p=>normalize(p.name)===normalize(i.name))}
function drawShop(){
 let c=$("#shopContent");if(!c)return;
 if(shoppingTab==="stock"){
   c.innerHTML=`<div class="card"><div class="notice">Les ingrédients cochés comme « déjà à la maison » seront exclus de la liste générée.</div>
   <form id="pantryForm" style="margin-top:12px"><div class="searchbar"><input id="pantryName" placeholder="Ex. huile d'olive" required><button class="primary">Ajouter</button></div></form>
   ${data.pantry.map((p,i)=>`<div class="pantryrow"><span style="flex:1">${escapeHtml(p.name)}</span><button class="iconbtn" onclick="removePantry(${i})">🗑</button></div>`).join("")||'<div class="empty">Ton stock est vide.</div>'}</div>`;
   $("#pantryForm").onsubmit=e=>{e.preventDefault();let n=$("#pantryName").value.trim();if(n&&!data.pantry.some(p=>normalize(p.name)===normalize(n)))data.pantry.push({name:n});save(true);drawShop()};
   return;
 }
 if(shoppingTab==="partage"){
   c.innerHTML=`<div class="card"><h3>Synchronisation à deux</h3><p>La V2 est prête pour un espace partagé, mais il faut connecter une base de données gratuite pour que les changements soient instantanément visibles sur vos deux téléphones.</p><div class="notice"><b>Coût : 0 €.</b> Nous connecterons ensuite Supabase gratuit à cette application.</div></div>
   <div class="card"><h3>Sauvegarde manuelle</h3><p class="muted">En attendant la synchronisation, tu peux sauvegarder tes données dans un fichier puis les restaurer sur un autre appareil.</p><div class="actions2"><button class="outline" onclick="exportData()">Exporter</button><label class="primary" style="margin:0;text-align:center;cursor:pointer">Importer<input type="file" accept=".json" onchange="importData(event)" style="display:none"></label></div></div>`;
   return;
 }
 let weeks=data.shoppingWeeks||1, items=plannedIngredients(weeks);
 data.manual.forEach(x=>{let k="manual|"+x.id;items[k]={...x,key:k,manual:true}});
 let visible=Object.values(items).filter(i=>i.manual||!pantryHas(i));
 let groups={};visible.forEach(i=>(groups[i.section||"Autre"]??=[]).push(i));
 c.innerHTML=`<div class="card">
  <div class="grid2"><label>Courses pour<select id="shopWeeks"><option value="1">1 semaine</option><option value="2">2 semaines</option><option value="3">3 semaines</option><option value="4">4 semaines</option></select></label><label>&nbsp;<button class="primary" style="margin-top:6px;width:100%" onclick="generateShopping()">✨ Générer ma liste</button></label></div>
  <div class="muted">${data.shoppingGeneratedAt?`Dernière génération : ${new Date(data.shoppingGeneratedAt).toLocaleString("fr-FR")}`:"Planifie tes repas puis génère la liste."}</div>
 </div>
 ${Object.keys(groups).length?Object.entries(groups).map(([sec,arr])=>`<div class="card group"><h3>${escapeHtml(sec)} <span class="badge">${arr.length}</span></h3>${arr.map(i=>{let ck=!!data.checked[i.key];return `<label class="shoprow ${ck?"done":""}"><input type="checkbox" ${ck?"checked":""} onchange="checkShop('${encodeURIComponent(i.key)}',this.checked)"><span style="flex:1">${fmtNum(i.qty)} ${escapeHtml(i.unit||"")} ${escapeHtml(i.name)}</span>${i.manual?`<button type="button" class="iconbtn" onclick="removeManual('${i.id}')">🗑</button>`:`<button type="button" class="iconbtn" title="Déjà à la maison" onclick="addPantryFrom('${encodeURIComponent(i.name)}')">🏠</button>`}</label>`}).join("")}</div>`).join(""):'<div class="card empty">Aucun article. Planifie des repas ou ajoute un article manuellement.</div>'}
 <div class="card"><h3>Ajouter autre chose</h3><div class="chips">
 <button class="chipfilter" onclick="quickManual('Hygiène')">🧴 Hygiène</button>
 <button class="chipfilter" onclick="quickManual('Entretien')">🧹 Entretien</button>
 <button class="chipfilter" onclick="quickManual('Maison')">🏠 Maison</button>
 <button class="chipfilter" onclick="quickManual('Animaux')">🐾 Animaux</button>
 <button class="chipfilter" onclick="quickManual('Parapharmacie')">✚ Parapharmacie</button>
</div></div>
<button class="outline" style="width:100%" onclick="manualDialog.showModal()">＋ Ajouter un article</button>`;
 $("#shopWeeks").value=weeks;$("#shopWeeks").onchange=e=>{data.shoppingWeeks=+e.target.value;save(true);drawShop()};
}
window.generateShopping=()=>{data.checked={};data.shoppingGeneratedAt=Date.now();save(true);drawShop()};
window.checkShop=(k,v)=>{data.checked[decodeURIComponent(k)]=v;save(true);drawShop()};
window.quickManual=section=>{$("#manualSection").value=section;manualDialog.showModal()};
$("#manualForm").onsubmit=e=>{e.preventDefault();data.manual.push({id:uid("m"),name:$("#manualName").value.trim(),qty:+$("#manualQty").value||1,unit:$("#manualUnit").value.trim(),section:$("#manualSection").value.trim()||"Autre"});manualDialog.close();e.target.reset();save(true);drawShop()};
window.removeManual=id=>{data.manual=data.manual.filter(x=>x.id!==id);save(true);drawShop()};
window.addPantryFrom=s=>{let n=decodeURIComponent(s);if(!data.pantry.some(p=>normalize(p.name)===normalize(n)))data.pantry.push({name:n});save(true);drawShop()};
window.removePantry=i=>{data.pantry.splice(i,1);save(true);drawShop()};
window.exportData=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="nout-kaz-sauvegarde.json";a.click();URL.revokeObjectURL(a.href)};
window.importData=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{data=JSON.parse(rd.result);save();alert("Données restaurées.")}catch(err){alert("Fichier invalide.")}};rd.readAsText(f)};

$("#loginForm").onsubmit=async e=>{
 e.preventDefault();$("#authError").textContent="";
 const email=$("#loginEmail").value.trim(),password=$("#loginPassword").value;
 const {data:res,error}=await sb.auth.signInWithPassword({email,password});
 if(error){$("#authError").textContent="Connexion impossible : "+error.message;return}
 currentUser=res.user;$("#authScreen").style.display="none";$("#app").style.display="";
 try{await loadRemote()}catch(err){$("#authError").textContent=err.message;alert(err.message)}
};
$("#logoutBtn").onclick=async()=>{await sb.auth.signOut();currentUser=null;householdUuid=null;$("#app").style.display="none";$("#authScreen").style.display="grid"};

sb.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_OUT"){currentUser=null;householdUuid=null}
});

// Listen for edits made by the other phone.
sb.channel("nout-kaz-shared")
 .on("postgres_changes",{event:"UPDATE",schema:"public",table:"nout_kaz_data"},payload=>{
   if(!householdUuid || payload.new.household_uuid!==householdUuid)return;
   const incoming=payload.new.data||{};
   if(!incoming.recipes && !incoming.planning)return;
   isApplyingRemote=true;
   data={...seed,...incoming};
   if(!data.pantry)data.pantry=[];if(!data.history)data.history=[];if(!data.manual)data.manual=[];
   localStorage.setItem(KEY,JSON.stringify(data));
   isApplyingRemote=false;
   setSyncStatus("✓ Mis à jour");
   render();
 }).subscribe();

// Fallback refresh every 20 seconds if realtime isn't enabled for the table.
setInterval(async()=>{
 if(!currentUser||!householdUuid)return;
 try{
   const {data:row,error}=await sb.from("nout_kaz_data").select("data").eq("household_uuid",householdUuid).maybeSingle();
   if(error||!row)return;
   const incoming=row.data||{};
   if(JSON.stringify(incoming)!==JSON.stringify(data)){
     isApplyingRemote=true;data={...seed,...incoming};
     if(!data.pantry)data.pantry=[];if(!data.history)data.history=[];if(!data.manual)data.manual=[];
     localStorage.setItem(KEY,JSON.stringify(data));isApplyingRemote=false;render();setSyncStatus("✓ Mis à jour");
   }
 }catch(e){}
},20000);

bootAuth();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
